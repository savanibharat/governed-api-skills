# Decision & hardcoding register for governed-api-skills.
# Every deliberate shortcut, fixed threshold, and temporary limitation is recorded here.
# When a decision changes, update its entry (set status: superseded; do not erase history).
version: 1
project: governed-api-skills
decisions:
  - id: DD-001
    category: architecture
    component: generated-skill
    description: >
      Generated skills use core-only frontmatter (name, description, and optional
      license/compatibility/metadata). No Claude Code-only fields.
    reason: >
      Portability across the open Agent Skills standard. Non-core fields silently
      break on non-Claude runtimes.
    impact: The factory itself MAY use Claude Code extensions; generated skills MUST NOT.
    configurable: false
    status: active
    revisit_when: A target runtime is permanently fixed to Claude-only.

  - id: DD-002
    category: architecture
    component: uber-standard
    description: >
      The uber standard (shared guards) is BAKED into each generated skill at
      generation time, with a version stamp in metadata.uber_standard_version.
    reason: >
      Self-contained, portable, confidentiality-safe skills while preserving
      fix-once governance via a drift check against the stamp.
    impact: >
      Updating the uber standard requires regenerating skills to propagate; a drift
      check lists stale skills.
    configurable: false
    status: active
    revisit_when: Skills are guaranteed to live beside the federation repo.

  - id: DD-003
    category: security
    component: response-presentation
    description: >
      JSON to Markdown rendering uses a declarative mapping interpreted by one
      audited primitive (uber-standard/render_markdown.py). Bespoke per-skill
      scripts are a gated escape hatch only.
    reason: Avoid executing freshly generated code by default (security + maintenance surface).
    impact: >
      A bespoke script requires written justification, human review, sandboxed
      execution, registration here, and its own adversarial eval.
    configurable: false
    status: active
    revisit_when: A declarative mapping genuinely cannot express a required layout.

  - id: DD-004
    category: hardcoded_assumption
    component: document-ingestion
    description: Initial input document support is PDF, Markdown, and TXT.
    reason: Covers initial validation scenarios.
    impact: DOCX, HTML, and others are not supported yet.
    configurable: false
    status: active
    revisit_when: A real use case requires additional document formats.

  - id: DD-005
    category: hardcoded_assumption
    component: scope
    description: Generated skills operate in English only (v1).
    reason: Bounds the initial validation and sanitization surface.
    impact: Non-English inputs/outputs are out of scope for v1.
    configurable: true
    status: active
    revisit_when: A validated need for another language appears.

  - id: DD-006
    category: evaluation
    component: evaluation-policy
    description: Initial functional acceptance threshold is 90 percent on the agreed test set.
    reason: Establish an initial quality bar.
    impact: Passing the threshold is NOT proof a skill is secure.
    configurable: true
    status: active
    revisit_when: Baseline results justify a change.

  - id: DD-007
    category: architecture
    component: mcp
    description: >
      Skills instruct Claude to USE an MCP tool that calls the REST API. The factory
      never generates or modifies MCP servers.
    reason: A tool-usage skill is not a server implementation.
    impact: MCP server artifacts are out of scope; MCP tool contracts are inputs only.
    configurable: false
    status: active
    revisit_when: Scope is explicitly expanded beyond skill engineering.

  - id: DD-008
    category: naming
    component: factory
    description: Factory skill name is "governed-api-skills".
    reason: Kebab-case, 64 chars max, no reserved words; leads with the governance differentiator.
    impact: The product may still be called "AI Skill Engineering Factory".
    configurable: false
    status: active
    revisit_when: A rename is explicitly requested.

  - id: DD-009
    category: architecture
    component: ingestion
    description: >
      Company inputs are multiple typed documents (best-practices, routing-policy,
      repository-map) plus examples. Each document's role is identified explicitly; roles are
      never guessed, and conflicts between documents are surfaced.
    reason: Prevent mis-identifying a document's role and misusing its content.
    impact: Ingestion records the role assigned to each document as evidence.
    configurable: false
    status: active
    revisit_when: A new company document role appears.

  - id: DD-010
    category: architecture
    component: routing
    description: >
      Routing is derived from company docs plus examples with routing provenance. Every artifact
      type must be routed (a closed set); there are no guessed defaults; a dry-run plan and
      scripts/check_routing.py gate every routing write.
    reason: Ironclad placement - no artifact lands in the wrong repo.
    impact: An uncovered artifact type stops for a question; federation writes need approval.
    configurable: false
    status: active
    revisit_when: The artifact type set or repo model changes.

  - id: DD-012
    category: quality
    component: enforcement
    description: >
      Governance guarantees are mechanically enforced wherever possible (conformance, artifact
      schemas, routing completeness, traceability completeness, deterministic eval checks) via
      scripts with unit tests and CI. Guarantees that require judgement (never-invent semantics,
      behavioral/adversarial evals) are labelled [agent] in RUN.md and recorded as REQUIRES_AGENT
      - never silently passed.
    reason: Close the gap between declared and enforced guarantees; be honest about the rest.
    impact: Deterministic evidence is produced by scripts/run_evals.py; behavioral evals still need an agent harness.
    configurable: false
    status: active
    revisit_when: An agent eval harness is bundled.

  - id: DD-013
    category: adoption
    component: setup
    description: start.sh installs into an isolated .venv rather than system Python.
    reason: Avoid --break-system-packages and side effects on the user's machine.
    impact: Dependencies live in .venv; activate it or use .venv/bin/python.
    configurable: false
    status: active
    revisit_when: A different packaging mechanism is adopted.

  - id: DD-014
    category: security
    component: injection-scanner
    description: >
      scan_untrusted_doc.py is an ADVISORY tripwire (regex + NFKC normalization), not a defense.
      The real defense is the treat-as-data discipline and the deterministic renderer.
    reason: Regex scanning is evadable by rephrasing, novel wording, or other languages.
    impact: The scanner surfaces findings for review; it never blocks or is relied on as a control.
    configurable: false
    status: active
    revisit_when: A stronger detector is added (still not a sole control).

  - id: DD-015
    category: governance
    component: workspace-profile
    description: >
      The workspace profile is enforced by scripts/check_profile.py. Policy is ALLOW-BUT-HOLD:
      when allow_federation_writes is false, shared/federated artifacts must route to an
      approval-gated repo (held as proposals, never silently written); a silent-write
      contradiction fails the gate.
    reason: The profile was decorative; routing could target federation while the profile forbade it.
    impact: Shared artifacts are hold-only under a restrictive profile; enforced at validate and route.
    configurable: false
    status: active
    revisit_when: Profile semantics change (e.g. hard-block instead of hold).

  - id: DD-016
    category: evaluation
    component: evaluation-policy
    description: >
      Coverage is enforced (scripts/check_eval_coverage.py): minimum negative and regression
      tests and required categories. Adversarial release gating now blocks on unresolved findings
      at or above 'high', not only 'critical'.
    reason: A single functional pass-rate bar did not guarantee negative/adversarial/regression coverage.
    impact: An eval suite missing a category or the minimum counts fails the coverage gate.
    configurable: true
    status: active
    revisit_when: Baseline results justify different thresholds.

  - id: DD-017
    category: security
    component: traceability-enforcement
    description: >
      Drift verifies baked guard FILE HASHES against uber-standard (not just the version stamp)
      and flags unstamped skills. Traceability requires the eval suite (a missing suite is an
      error). check_instruction_provenance.py flags HTTP operations instructed by SKILL.md that
      are not documented in the skill's references - a tripwire, since traceability alone is
      self-reported by the generator.
    reason: Stamp-only drift missed hand-edits; traceability silently skipped eval links and never read the skill body.
    impact: Hand-edited guards, unstamped skills, missing eval suites, and undocumented operations now fail a gate.
    configurable: false
    status: active
    revisit_when: A semantic instruction-to-requirement matcher is added.

  - id: DD-018
    category: security
    component: integrity-gates
    description: >
      Drift treats a folder as a generated skill if it has ANY marker (guards, stamp,
      traceability.yaml, registration.yaml, evals/) and FAILS on a missing guard or stamp, so a
      check cannot be dodged by deleting the thing it checks. Instruction-provenance compares the
      skill's instructed operations against the SOURCE OpenAPI spec (case-insensitive, URL-aware,
      path-param normalized), not the generator-written references. The unused
      references/UBER_VERSION decoy was removed; a visible verify.sh mirrors CI.
    reason: Checks were evadable by removing the checked artifact or by self-documenting a bogus op.
    impact: Stripped guards/stamp and undocumented operations now fail a gate; prose-only instructions remain a semantic (agent) gap.
    configurable: false
    status: active
    revisit_when: A semantic instruction matcher or full agent eval harness lands.

  - id: DD-011
    category: adoption
    component: entrypoint
    description: >
      Single frictionless entry: one-command setup (start.sh installs only pyyaml + jsonschema
      and verifies the package) and one ordered runbook (RUN.md) with a VERIFY gate per step.
      Invocation is natural language; no slash commands required.
    reason: Minimize adoption friction - point at repositories and run, like a one-line install.
    impact: The only runtime dependencies are python3 + two packages; everything else is files.
    configurable: false
    status: active
    revisit_when: A packaging/installer mechanism is added.
